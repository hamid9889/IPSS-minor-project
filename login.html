<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - IPSS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-body">

    <!-- Header with Back to Home Link -->
    <header class="landing-header">
        <a href="index.html" class="logo">
            <div class="logo-icon">&#9994;</div>
            IPSS
        </a>
        <a href="index.html" class="btn-signin">&larr; Back to Home</a>
    </header>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please enter your credentials to sign in.</p>

            <div id="loginErrorMessage" class="error-banner"
                style="display: none; background-color: #fee2e2; color: #b91c1c; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center;">
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="admin" value="admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123"
                        required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" checked> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary btn-full">Sign In to Dashboard</button>
            </form>


        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
